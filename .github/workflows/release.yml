name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without the v prefix, for example 1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          ! git rev-parse "v$VERSION" >/dev/null 2>&1

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Verify Laravel engine independently
        working-directory: engine/laravel
        run: |
          composer validate --strict --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress
          composer audit
          vendor/bin/phpstan analyse --memory-limit=1G
          vendor/bin/pint --test src tests routes config
          APP_ENV=testing DB_CONNECTION=sqlite DB_DATABASE=':memory:' CACHE_STORE=array SESSION_DRIVER=array vendor/bin/phpunit

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: engine/go/go.mod

      - name: Verify Go engine independently
        working-directory: engine/go
        run: |
          test -z "$(gofmt -l .)"
          go test ./...

      - uses: actions/setup-node@v5
        with:
          node-version: '26.8.1'
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Verify editor independently
        working-directory: editor
        run: |
          npm ci --no-audit --no-fund
          npm run test:coverage
          npm run build
          test -s dist/page-builder.js
          test -s dist/page-builder.css

      - name: Build release artifacts
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p release-dist

          (cd engine/laravel && composer archive --format=zip --dir=../../release-dist --file="page-builder-engine-laravel-v$VERSION")
          (cd engine/go && GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "../../release-dist/page-builder-engine-go-linux-amd64-v$VERSION" ./cmd/page-builder-render)

          zip -qr "release-dist/page-builder-editor-v$VERSION.zip" editor/dist editor/package.json
          zip -qr "release-dist/page-builder-specification-v$VERSION.zip" specification
          zip -qr "release-dist/page-builder-blocks-v$VERSION.zip" blocks

          test -s "release-dist/page-builder-engine-laravel-v$VERSION.zip"
          test -x "release-dist/page-builder-engine-go-linux-amd64-v$VERSION"
          test -s "release-dist/page-builder-editor-v$VERSION.zip"
          test -s "release-dist/page-builder-specification-v$VERSION.zip"
          test -s "release-dist/page-builder-blocks-v$VERSION.zip"

          (cd release-dist && sha256sum * > SHA256SUMS)

      - name: Tag and publish GitHub release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" release-dist/* --generate-notes --title "v$VERSION"
