name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without the v prefix, for example 1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          ! git rev-parse "v$VERSION" >/dev/null 2>&1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Validate portable blocks
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.25.1
          python scripts/validate-block-packages.py

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Verify Laravel engine independently
        working-directory: engine/laravel
        run: |
          composer validate --strict --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress
          composer audit
          vendor/bin/phpstan analyse --memory-limit=1G
          vendor/bin/pint --test src tests routes config
          APP_ENV=testing DB_CONNECTION=sqlite DB_DATABASE=':memory:' CACHE_STORE=array SESSION_DRIVER=array vendor/bin/phpunit

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: engine/go/go.sum

      - name: Verify Go CMS independently
        working-directory: engine/go
        run: |
          test -z "$(gofmt -l .)"
          go mod verify
          go vet ./...
          go test ./...

      - uses: actions/setup-node@v5
        with:
          node-version: '26.8.1'
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Verify editor independently
        working-directory: editor
        run: |
          npm ci --no-audit --no-fund
          npm run test:coverage
          npm run build
          test -s dist/page-builder.js
          test -s dist/index.js
          test -s dist/page-builder.css
          npm run pack:check

      - name: Build release artifacts
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-dist

          (cd engine/laravel && composer archive --format=zip --dir=../../release-dist --file="page-builder-engine-laravel-v$VERSION")

          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=""
              [ "$os" = windows ] && ext=".exe"
              cms_output="../../release-dist/page-builder-cms-go-${os}-${arch}-v${VERSION}${ext}"
              renderer_output="../../release-dist/page-builder-renderer-go-${os}-${arch}-v${VERSION}${ext}"
              (
                cd engine/go
                GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/zaengit/page-builder/engine/go.EngineVersion=$VERSION" -o "$cms_output" ./cmd/cms
                GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/zaengit/page-builder/engine/go.EngineVersion=$VERSION" -o "$renderer_output" ./cmd/page-builder-render
              )
            done
          done

          zip -qr "release-dist/page-builder-go-cms-source-v$VERSION.zip" engine/go docs/go-engine.md docs/go-full-cms-plan.md
          zip -qr "release-dist/page-builder-editor-v$VERSION.zip" editor/dist editor/src editor/package.json editor/README.md
          zip -qr "release-dist/page-builder-specification-v$VERSION.zip" specification docs/version-compatibility.md docs/migration-policy.md docs/third-engine.md
          zip -qr "release-dist/page-builder-blocks-v$VERSION.zip" blocks docs/block-package-format.md docs/portable-blocks.md scripts/validate-block-packages.py

          cat > release-dist/manifest.json <<JSON
          {
            "release": "$VERSION",
            "specification": 1,
            "page": 1,
            "block": 1,
            "datasource": 1,
            "rendererProtocol": 1,
            "templateLanguage": 1,
            "engines": ["laravel", "go"],
            "go": {
              "type": "standalone-cms",
              "defaultDatabase": "sqlite",
              "databaseLayer": "gorm",
              "databases": ["sqlite", "postgres", "mysql", "sqlserver"],
              "compatibilityRenderer": true
            },
            "editor": "page-builder-editor"
          }
          JSON

          test -s "release-dist/page-builder-engine-laravel-v$VERSION.zip"
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=""
              [ "$os" = windows ] && ext=".exe"
              test -s "release-dist/page-builder-cms-go-${os}-${arch}-v${VERSION}${ext}"
              test -s "release-dist/page-builder-renderer-go-${os}-${arch}-v${VERSION}${ext}"
            done
          done
          test -s "release-dist/page-builder-go-cms-source-v$VERSION.zip"
          test -s "release-dist/page-builder-editor-v$VERSION.zip"
          test -s "release-dist/page-builder-specification-v$VERSION.zip"
          test -s "release-dist/page-builder-blocks-v$VERSION.zip"
          test -s release-dist/manifest.json

          (cd release-dist && sha256sum * > SHA256SUMS)
          test -s release-dist/SHA256SUMS

      - name: Tag and publish GitHub release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" release-dist/* --generate-notes --title "v$VERSION"
