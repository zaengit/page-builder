name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without the v prefix, for example 1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          ! git rev-parse "v$VERSION" >/dev/null 2>&1

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Verify Laravel engine
        run: |
          composer validate --strict
          (cd engine/laravel && composer validate --strict --no-check-publish)
          composer install --no-interaction --prefer-dist --no-progress
          composer audit
          cp .env.example .env
          php artisan key:generate
          vendor/bin/phpstan analyse --memory-limit=1G
          vendor/bin/pint --test src engine/laravel/src routes config
          APP_ENV=testing DB_CONNECTION=sqlite DB_DATABASE=':memory:' CACHE_STORE=array SESSION_DRIVER=array vendor/bin/phpunit

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: engine/go/go.mod

      - name: Verify and build Go engine
        run: |
          cd engine/go
          test -z "$(gofmt -l .)"
          go test ./...
          cd ../..
          bash scripts/build-engines.sh
          test -x dist/engine/page-builder-engine-go
          dist/engine/page-builder-engine-go --version | grep -q 'protocol=1 specification=1'
          printf '%s' '{"version":1,"page":{"version":1,"blocks":[]},"context":{},"blockRoot":"blocks"}' | dist/engine/page-builder-engine-go | grep -q '"html"'

      - uses: actions/setup-node@v5
        with:
          node-version: '26.8.1'
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Build distributable editor
        working-directory: editor
        run: |
          npm ci --no-audit --no-fund
          npm run test:coverage
          npm run build
          test -s ../resources/dist/page-builder.js
          test -s ../resources/dist/page-builder.css

      - name: Install Playwright Chromium
        working-directory: editor
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        working-directory: editor
        run: npm run test:e2e

      - name: Commit distributable assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f resources/dist/page-builder.js resources/dist/page-builder.js.map resources/dist/page-builder.css
          if ! git diff --cached --quiet; then
            git commit -m "build: compile editor for v$VERSION"
            git push origin HEAD:main
          fi

      - name: Build and verify Composer archive
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p release-dist
          composer archive --format=zip --dir=release-dist --file="page-builder-v$VERSION"
          ARCHIVE="release-dist/page-builder-v$VERSION.zip"
          test -s "$ARCHIVE"
          unzip -l "$ARCHIVE" > release-dist/archive.txt
          grep -q 'engine/laravel/composer.json' release-dist/archive.txt
          grep -q 'engine/laravel/src/Runtime/RuntimeRenderer.php' release-dist/archive.txt
          grep -q 'engine/go/renderer.go' release-dist/archive.txt
          grep -q 'engine/go/go.mod' release-dist/archive.txt
          grep -q 'blocks/heading/block.json' release-dist/archive.txt
          grep -q 'blocks/heading/template.html' release-dist/archive.txt
          grep -q 'specification/page.schema.json' release-dist/archive.txt
          grep -q 'specification/block.schema.json' release-dist/archive.txt
          grep -q 'specification/renderer-protocol.schema.json' release-dist/archive.txt
          grep -q 'docs/universal-editor-engine-distribution-plan.md' release-dist/archive.txt
          ! grep -q '/core/' release-dist/archive.txt
          ! grep -q '/renderers/' release-dist/archive.txt
          ! grep -q '/tests/' release-dist/archive.txt
          ! grep -q '/.github/' release-dist/archive.txt

      - name: Stage Go binary for release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cp dist/engine/page-builder-engine-go "release-dist/page-builder-engine-go-linux-amd64-v$VERSION"
          test -x "release-dist/page-builder-engine-go-linux-amd64-v$VERSION"

      - name: Tag and publish GitHub release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" \
            "release-dist/page-builder-v$VERSION.zip" \
            "release-dist/page-builder-engine-go-linux-amd64-v$VERSION" \
            --generate-notes \
            --title "v$VERSION"
