name: Go Normalize

on:
  push:
    branches: [main]
    paths:
      - 'engine/go/**'

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - name: Normalize module and formatting
        working-directory: engine/go
        run: |
          gofmt -w .
          go mod tidy
      - name: Commit normalized Go sources
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine/go
          git commit -m 'chore(go): normalize module and formatting'
          git push origin HEAD:main
