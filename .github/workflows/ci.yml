name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run PHP static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G
      - name: Check PHP formatting
        run: vendor/bin/pint --test src routes config
      - name: Run backend tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: vendor/bin/phpunit

  editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '26.8.1'
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install editor dependencies and refresh lockfile
        run: npm install --no-audit --no-fund
      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: shadcn-package-lock
          path: editor/package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Build editor
        run: npm run build
      - name: Verify package assets
        run: |
          test -s ../resources/dist/page-builder.js
          test -s ../resources/dist/page-builder.css
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npm run test:e2e
      - name: Upload Playwright screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: editor/artifacts/screenshots/*.png
          if-no-files-found: error
          retention-days: 7
