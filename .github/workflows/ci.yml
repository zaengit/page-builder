name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  specification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install specification validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Validate schemas, blocks, and conformance fixtures
        run: |
          python - <<'PY'
          import json
          import pathlib
          from jsonschema import Draft202012Validator

          root = pathlib.Path('.')
          schema_paths = [
              root / 'specification/page.schema.json',
              root / 'specification/block.schema.json',
              root / 'specification/datasource.schema.json',
              root / 'specification/renderer-protocol.schema.json',
          ]
          schemas = {}
          for path in schema_paths:
              data = json.loads(path.read_text())
              Draft202012Validator.check_schema(data)
              schemas[path.name] = data

          block_validator = Draft202012Validator(schemas['block.schema.json'])
          for path in sorted((root / 'blocks').glob('*/block.json')):
              block_validator.validate(json.loads(path.read_text()))

          page_validator = Draft202012Validator(schemas['page.schema.json'])
          result_validator = Draft202012Validator(schemas['renderer-protocol.schema.json']['$defs']['result'])
          fixtures = sorted((root / 'specification/conformance').glob('*.json'))
          if not fixtures:
              raise SystemExit('no conformance fixtures found')
          for path in fixtures:
              fixture = json.loads(path.read_text())
              if 'page' in fixture and 'expected' in fixture:
                  page_validator.validate(fixture['page'])
                  result_validator.validate(fixture['expected'])
              elif 'templateCases' in fixture:
                  if fixture.get('version') != 1 or not fixture['templateCases']:
                      raise SystemExit(f'invalid template fixture: {path}')
              else:
                  raise SystemExit(f'unknown fixture shape: {path}')
          PY
      - name: Verify engine-neutral portable artifacts
        run: |
          ! grep -R -n -E 'Illuminate\\\\|Laravel\\\\|Eloquent|Blade' specification blocks --include='*.json' --include='*.html'
          test -z "$(find blocks -name 'template.blade.php' -print)"
      - name: Verify canonical repository boundaries
        run: |
          test -d editor
          test -d specification
          test -d blocks
          test -d engine/laravel
          test -d engine/go
          test ! -e core
          test ! -e renderers
          test ! -e artisan
          test ! -e bootstrap
          test ! -e config
          test ! -e public
          test ! -e resources
          test ! -e routes
          test ! -e src
          test ! -e storage
          test ! -e tests
          test ! -e composer.json
          test ! -e phpunit.xml
          test ! -e phpstan.neon
          test -f engine/laravel/composer.json
          test -d engine/laravel/src
          test -d engine/laravel/tests

  laravel-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine/laravel
    steps:
      - uses: actions/checkout@v5
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Audit Composer dependencies
        run: composer audit
      - name: Run PHP static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G
      - name: Check PHP formatting
        run: vendor/bin/pint --test src tests routes config
      - name: Run Laravel engine tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: vendor/bin/phpunit
      - name: Verify independent Composer archive
        run: |
          mkdir -p ../../dist/laravel
          composer archive --format=zip --dir=../../dist/laravel --file=page-builder-engine-laravel-ci
          test -s ../../dist/laravel/page-builder-engine-laravel-ci.zip

  go-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: engine/go/go.mod
      - name: Verify Go engine
        working-directory: engine/go
        run: |
          test -z "$(gofmt -l .)"
          go test ./...
      - name: Build Go engine artifact
        run: bash scripts/build-engines.sh

  editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26.8.1'
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test editor
        run: npm run test:coverage
      - name: Build independent editor distribution
        run: |
          npm run build
          test -s dist/page-builder.js
          test -s dist/page-builder.css
      - name: Browser E2E
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  distribution-boundaries:
    runs-on: ubuntu-latest
    needs: [specification, laravel-engine, go-engine, editor]
    steps:
      - uses: actions/checkout@v5
      - name: Build independently packageable source archives
        run: |
          mkdir -p dist
          zip -qr dist/specification.zip specification
          zip -qr dist/blocks.zip blocks
          zip -qr dist/editor-source.zip editor -x 'editor/node_modules/*' 'editor/dist/*'
          zip -qr dist/laravel-engine-source.zip engine/laravel
          zip -qr dist/go-engine-source.zip engine/go
          test -s dist/specification.zip
          test -s dist/blocks.zip
          test -s dist/editor-source.zip
          test -s dist/laravel-engine-source.zip
          test -s dist/go-engine-source.zip
