name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  specification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install specification validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Validate JSON syntax and JSON Schema
        run: |
          python - <<'PY'
          import json
          import pathlib
          from jsonschema import Draft202012Validator

          root = pathlib.Path('.')
          schema_paths = [
              root / 'specification/page.schema.json',
              root / 'specification/block.schema.json',
              root / 'specification/datasource.schema.json',
              root / 'specification/renderer-protocol.schema.json',
          ]
          schemas = {}
          for path in schema_paths:
              data = json.loads(path.read_text())
              Draft202012Validator.check_schema(data)
              schemas[path.name] = data
              print('valid schema', path)

          block_validator = Draft202012Validator(schemas['block.schema.json'])
          for path in sorted((root / 'blocks').glob('*/block.json')):
              block_validator.validate(json.loads(path.read_text()))
              print('valid block', path)

          page_validator = Draft202012Validator(schemas['page.schema.json'])
          result_validator = Draft202012Validator(schemas['renderer-protocol.schema.json']['$defs']['result'])
          fixture_paths = sorted((root / 'specification/conformance').glob('*.json'))
          if not fixture_paths:
              raise SystemExit('no conformance fixtures found')
          for fixture_path in fixture_paths:
              fixture = json.loads(fixture_path.read_text())
              page_validator.validate(fixture['page'])
              result_validator.validate(fixture['expected'])
              print('valid conformance', fixture_path)
          PY
      - name: Verify portable machine-readable artifacts are engine neutral
        run: |
          ! grep -R -n -E 'Illuminate\\\\|Laravel\\\\|Eloquent|Blade|github.com/zaengit/page-builder/engine/go' specification/*.json specification/conformance blocks --include='*.json' --include='*.html'
      - name: Verify canonical repository boundaries
        run: |
          test -d editor
          test -d specification
          test -d blocks
          test -d engine/laravel
          test -d engine/go
          test -d engine/laravel/tests
          test ! -e core
          test ! -e renderers

  laravel-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - name: Validate Composer metadata
        run: |
          composer validate --strict
          (cd engine/laravel && composer validate --strict --no-check-publish)
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Audit Composer dependencies
        run: composer audit
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run PHP static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G
      - name: Check PHP formatting
        run: vendor/bin/pint --test src engine/laravel/src engine/laravel/tests routes config
      - name: Run Laravel engine tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: vendor/bin/phpunit

  go-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: engine/go/go.mod
      - name: Format check Go engine
        working-directory: engine/go
        run: test -z "$(gofmt -l .)"
      - name: Test Go engine
        working-directory: engine/go
        run: go test ./...
      - name: Build deployable Go engine artifact
        run: bash scripts/build-engines.sh
      - name: Smoke test Go engine artifact
        run: |
          test -x dist/engine/page-builder-engine-go
          dist/engine/page-builder-engine-go --version | grep -q 'protocol=1 specification=1'
          printf '%s' '{"version":1,"page":{"version":1,"blocks":[]},"context":{},"blockRoot":"blocks"}' | dist/engine/page-builder-engine-go | grep -q '"html"'
      - name: Upload Go engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: page-builder-engine-go-linux-amd64
          path: dist/engine/page-builder-engine-go
          if-no-files-found: error
          retention-days: 7

  editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '26.8.1'
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install editor dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Build editor
        run: npm run build
      - name: Verify package assets
        run: |
          test -s ../resources/dist/page-builder.js
          test -s ../resources/dist/page-builder.css
      - name: Upload compiled editor assets
        uses: actions/upload-artifact@v4
        with:
          name: editor-dist
          path: |
            resources/dist/page-builder.js
            resources/dist/page-builder.js.map
            resources/dist/page-builder.css
          if-no-files-found: error
          retention-days: 1
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npm run test:e2e

  package:
    runs-on: ubuntu-latest
    needs: [specification, laravel-engine, go-engine, editor]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
      - name: Download compiled editor assets
        uses: actions/download-artifact@v5
        with:
          name: editor-dist
          path: resources/dist
      - name: Stage release tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f resources/dist/page-builder.js resources/dist/page-builder.js.map resources/dist/page-builder.css
          git commit -m "ci: stage compiled editor assets"
      - name: Build Composer archive
        run: |
          mkdir -p package-dist
          composer archive --format=zip --dir=package-dist --file=page-builder-ci
          unzip -l package-dist/page-builder-ci.zip > package-dist/archive.txt
      - name: Verify archive boundaries
        run: |
          grep -q 'engine/laravel/composer.json' package-dist/archive.txt
          grep -q 'engine/laravel/src/Runtime/RuntimeRenderer.php' package-dist/archive.txt
          grep -q 'engine/go/renderer.go' package-dist/archive.txt
          grep -q 'specification/conformance/canonical-runtime.json' package-dist/archive.txt
          grep -q 'blocks/heading/template.html' package-dist/archive.txt
          ! grep -q '/core/' package-dist/archive.txt
          ! grep -q '/renderers/' package-dist/archive.txt
          ! grep -q '/editor/' package-dist/archive.txt
          ! grep -q '/tests/' package-dist/archive.txt
