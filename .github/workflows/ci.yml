name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Audit Composer dependencies
        run: composer audit
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run PHP static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G
      - name: Check PHP formatting
        run: vendor/bin/pint --test src routes config
      - name: Run backend tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: vendor/bin/phpunit

  universal-runtimes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - name: Test Go renderer
        working-directory: renderers/go
        run: go test ./...
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '26.8.1'
      - name: Test Node renderer
        working-directory: renderers/node
        run: npm test
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Test Python renderer
        working-directory: renderers/python
        run: python -m unittest -v test_renderer.py
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test Rust renderer
        working-directory: renderers/rust
        run: cargo test --all-targets

  editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '26.8.1'
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install editor dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Build editor
        run: npm run build
      - name: Verify package assets
        run: |
          test -s ../resources/dist/page-builder.js
          test -s ../resources/dist/page-builder.css
      - name: Upload compiled editor assets
        uses: actions/upload-artifact@v4
        with:
          name: editor-dist
          path: |
            resources/dist/page-builder.js
            resources/dist/page-builder.js.map
            resources/dist/page-builder.css
          if-no-files-found: error
          retention-days: 1
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npm run test:e2e
      - name: Upload Playwright screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: editor/artifacts/screenshots/*.png
          if-no-files-found: error
          retention-days: 7

  package:
    runs-on: ubuntu-latest
    needs: [backend, universal-runtimes, editor]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Download compiled editor assets
        uses: actions/download-artifact@v5
        with:
          name: editor-dist
          path: resources/dist
      - name: Stage release tree
        run: |
          test -s resources/dist/page-builder.js
          test -s resources/dist/page-builder.css
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f resources/dist/page-builder.js resources/dist/page-builder.js.map resources/dist/page-builder.css
          git commit -m "ci: stage compiled editor assets"
      - name: Build Composer archive
        run: |
          mkdir -p package-dist
          composer archive --format=zip --dir=package-dist --file=page-builder-ci
          test -s package-dist/page-builder-ci.zip
          unzip -l package-dist/page-builder-ci.zip > package-dist/archive.txt
      - name: Verify runtime archive contents
        run: |
          grep -q 'composer.json' package-dist/archive.txt
          grep -q 'LICENSE' package-dist/archive.txt
          grep -q 'src/PageBuilderServiceProvider.php' package-dist/archive.txt
          grep -q 'config/page-builder.php' package-dist/archive.txt
          grep -q 'resources/dist/page-builder.js' package-dist/archive.txt
          grep -q 'resources/dist/page-builder.css' package-dist/archive.txt
          grep -q 'blocks/heading/block.json' package-dist/archive.txt
          grep -q 'specification/rendering-spec.md' package-dist/archive.txt
          ! grep -q '/editor/' package-dist/archive.txt
          ! grep -q '/tests/' package-dist/archive.txt
          ! grep -q '/.github/' package-dist/archive.txt
