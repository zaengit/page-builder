name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  specification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install specification validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Validate schemas, versions, blocks, and conformance fixtures
        run: |
          python - <<'PY'
          import json
          import pathlib
          from jsonschema import Draft202012Validator

          root = pathlib.Path('.')
          spec = root / 'specification'
          version = json.loads((spec / 'version.json').read_text())
          expected_keys = {
              'specification', 'page', 'block', 'datasource',
              'rendererProtocol', 'templateLanguage', 'breakpoints'
          }
          if set(version) != expected_keys:
              raise SystemExit(f'invalid specification/version.json keys: {set(version)}')
          for key in expected_keys - {'breakpoints'}:
              if version[key] != 1:
                  raise SystemExit(f'unsupported canonical {key} version: {version[key]}')
          if version['breakpoints'] != ['desktop', 'tablet', 'mobile']:
              raise SystemExit('canonical breakpoint order changed')

          schema_paths = [
              spec / 'page.schema.json',
              spec / 'block.schema.json',
              spec / 'datasource.schema.json',
              spec / 'renderer-protocol.schema.json',
          ]
          schemas = {}
          for path in schema_paths:
              data = json.loads(path.read_text())
              Draft202012Validator.check_schema(data)
              schemas[path.name] = data

          page_validator = Draft202012Validator(schemas['page.schema.json'])
          datasource_root = schemas['datasource.schema.json']
          datasource_request_validator = Draft202012Validator({**datasource_root, '$ref': '#/$defs/request'})
          datasource_response_validator = Draft202012Validator({**datasource_root, '$ref': '#/$defs/response'})
          renderer_root = schemas['renderer-protocol.schema.json']
          result_validator = Draft202012Validator({**renderer_root, '$ref': '#/$defs/result'})

          fixtures = sorted((spec / 'conformance').glob('*.json'))
          if not fixtures:
              raise SystemExit('no conformance fixtures found')
          for path in fixtures:
              fixture = json.loads(path.read_text())
              if 'page' in fixture and 'expected' in fixture:
                  page_is_valid = page_validator.is_valid(fixture['page'])
                  expected_validity = fixture.get('pageSchemaValid', True)
                  if page_is_valid != expected_validity:
                      raise SystemExit(f'unexpected page schema validity in {path}: {page_is_valid}')
                  if expected_validity:
                      page_validator.validate(fixture['page'])
                  result_validator.validate(fixture['expected'])
              elif 'templateCases' in fixture:
                  if fixture.get('version') != version['templateLanguage'] or not fixture['templateCases']:
                      raise SystemExit(f'invalid template fixture: {path}')
              elif 'datasourceCases' in fixture:
                  if fixture.get('version') != version['datasource']:
                      raise SystemExit(f'invalid datasource fixture version: {path}')
                  cases = fixture['datasourceCases']
                  for request in cases.get('validRequests', []):
                      datasource_request_validator.validate(request)
                  for request in cases.get('invalidRequests', []):
                      if datasource_request_validator.is_valid(request):
                          raise SystemExit(f'expected invalid datasource request is valid: {request}')
                  for response in cases.get('validResponses', []):
                      datasource_response_validator.validate(response)
              else:
                  raise SystemExit(f'unknown fixture shape: {path}')
          PY
      - name: Validate portable block packages
        run: python scripts/validate-block-packages.py
      - name: Verify engine-neutral portable artifacts
        run: |
          ! grep -R -n -E 'Illuminate\\\\|Laravel\\\\|Eloquent|Blade' specification blocks --include='*.json' --include='*.html'
          test -z "$(find blocks -name 'template.blade.php' -print)"
      - name: Verify canonical repository boundaries and docs
        run: |
          test -d editor
          test -d specification
          test -d blocks
          test -d engine/laravel
          test -d engine/go
          test ! -e core
          test ! -e renderers
          test ! -e artisan
          test ! -e bootstrap
          test ! -e config
          test ! -e public
          test ! -e resources
          test ! -e routes
          test ! -e src
          test ! -e storage
          test ! -e tests
          test ! -e composer.json
          test ! -e phpunit.xml
          test ! -e phpstan.neon
          test ! -e scripts/build-universal-renderers.sh
          test -f engine/laravel/composer.json
          test -f engine/laravel/src/EngineVersion.php
          test -d engine/laravel/src
          test -d engine/laravel/tests
          test -f engine/go/version.go
          test -f engine/go/go.sum
          test -f engine/go/cmd/cms/main.go
          test -f engine/go/examples/sqlprovider/sqlprovider.go
          test -f editor/src/host-adapter.ts
          test -f editor/src/public-api.tsx
          test -f specification/version.json
          test -f specification/compatibility-policy.md
          for doc in architecture page-json block-manifest template-language datasource-reference renderer-protocol conformance-authoring editor-integration laravel-engine go-engine portable-blocks third-engine version-compatibility migration-policy security-model block-package-format; do
            test -s "docs/$doc.md"
          done

  laravel-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine/laravel
    steps:
      - uses: actions/checkout@v5
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Audit Composer dependencies
        run: composer audit
      - name: Run PHP static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G
      - name: Check PHP formatting
        run: vendor/bin/pint --test src tests routes config
      - name: Run Laravel engine tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: vendor/bin/phpunit
      - name: Verify independent Composer archive
        run: |
          mkdir -p ../../dist/laravel
          composer archive --format=zip --dir=../../dist/laravel --file=page-builder-engine-laravel-ci
          test -s ../../dist/laravel/page-builder-engine-laravel-ci.zip

  go-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: engine/go/go.sum
      - name: Verify Go CMS
        working-directory: engine/go
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi
          go mod verify
          go vet ./...
          go test ./...
      - name: Build Go CMS and renderer artifacts
        run: bash scripts/build-engines.sh
      - name: Verify executable metadata
        run: |
          cms="$(dist/engine/page-builder-cms-go --version)"
          renderer="$(dist/engine/page-builder-renderer-go --version)"
          echo "$cms"
          echo "$renderer"
          echo "$cms" | grep 'specification=1'
          echo "$renderer" | grep 'protocol=1'
          echo "$renderer" | grep 'specification=1'
      - name: Smoke test standalone CMS with SQLite
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'kill ${pid:-0} 2>/dev/null || true; rm -rf "$tmp"' EXIT
          HTTP_ADDR=127.0.0.1:18080 \
          DB_DRIVER=sqlite \
          DB_DSN="$tmp/cms.db" \
          STORAGE_PATH="$tmp/storage" \
          BLOCK_ROOT="$PWD/blocks" \
          dist/engine/page-builder-cms-go >"$tmp/cms.log" 2>&1 &
          pid=$!
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:18080/ready >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:18080/health | grep 'ok'
          curl --fail --silent http://127.0.0.1:18080/ready | grep 'ready'
          kill -TERM "$pid"
          wait "$pid"
          test -s "$tmp/cms.db"

  editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26.8.1'
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test editor
        run: npm run test:coverage
      - name: Build independent editor distribution
        run: |
          npm run build
          test -s dist/page-builder.js
          test -s dist/index.js
          test -s dist/page-builder.css
          npm run pack:check
      - name: Browser E2E
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  conformance-parity:
    runs-on: ubuntu-latest
    needs: [specification, laravel-engine, go-engine]
    steps:
      - uses: actions/checkout@v5
      - name: Assert both official engines consume the shared corpus
        run: |
          grep -q 'specification/conformance' engine/laravel/tests/RuntimeConformanceTest.php
          grep -q 'specification/conformance' engine/go/renderer_test.go
          test -s specification/conformance/canonical-runtime.json
          test -s specification/conformance/layout-responsive.json
          test -s specification/conformance/design-tokens-typography.json
          test -s specification/conformance/datasource-contract.json
          test -s specification/conformance/template-language.json

  distribution-boundaries:
    runs-on: ubuntu-latest
    needs: [specification, laravel-engine, go-engine, editor, conformance-parity]
    steps:
      - uses: actions/checkout@v5
      - name: Build independently packageable source archives
        run: |
          mkdir -p dist
          zip -qr dist/specification.zip specification
          zip -qr dist/blocks.zip blocks
          zip -qr dist/editor-source.zip editor -x 'editor/node_modules/*' 'editor/dist/*'
          zip -qr dist/laravel-engine-source.zip engine/laravel
          zip -qr dist/go-cms-source.zip engine/go
          test -s dist/specification.zip
          test -s dist/blocks.zip
          test -s dist/editor-source.zip
          test -s dist/laravel-engine-source.zip
          test -s dist/go-cms-source.zip
          (cd dist && sha256sum *.zip > SHA256SUMS)
          test -s dist/SHA256SUMS
