<figure data-block="core/image" data-block-id="{{ blockId }}" class="pb-color-scheme--{{ attrs.colorScheme }} {{ attrs.customClass }}" style="margin:0;padding:{{ attrs.spacing ?? "0 0 0 0" }};text-align:{{ attrs.alignment ?? "center" }};">{% if attrs.src %}<img src="{{ attrs.src }}" alt="{{ attrs.alt ?? "" }}" style="display:inline-block;max-width:100%;width:{{ attrs.width ?? "100%" }};height:auto;">{% endif %}{% if preview %}<div data-pb-image-placeholder>Choose an image</div>{% endif %}{% if attrs.caption %}<figcaption class="pb-text-caption">{{ attrs.caption }}</figcaption>{% endif %}</figure>
