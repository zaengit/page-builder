<section data-block="core/columns" data-block-id="{{ blockId }}" class="pb-color-scheme--{{ attrs.colorScheme }} {{ attrs.customClass }}" style="display:grid;grid-template-columns:repeat({{ attrs.columns ?? "2" }},minmax(0,1fr));gap:{{ attrs.gap ?? "24px" }};padding:{{ attrs.spacing ?? "0 0 0 0" }};">{{{ children }}}</section>
